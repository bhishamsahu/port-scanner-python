<!DOCTYPE html>
<html>
<head>
    <title>Port Scanner</title>
    <head>
   

<style>

body{
    background-color:black;
    color:lime;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}

input{
    padding:10px;
    width:250px;
    background:black;
    color:lime;
    border:1px solid lime;
}

button{
    padding:10px 20px;
    background:lime;
    border:none;
    color:black;
    cursor:pointer;
    font-weight:bold;
}

li{
    list-style:none;
    margin:10px;
    font-size:20px;
}
button:hover{
    background:red;
    color:white;
}

h1{
    text-shadow:0px 0px 10px lime;
}
</style>

</head>
<body>

<h1>Port Scanner</h1>

<form method="POST">
    <input type="text" name="target" placeholder="Enter IP">
    <button type="submit">Scan</button>
</form>

<h2>Open Ports:</h2>

<ul>
    {% for port in ports %}
        <li>Port {{port}} is OPEN</li>
    {% endfor %}
</ul>

</body>
</html>
